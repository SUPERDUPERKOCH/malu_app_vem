<title>App Vida em Movimento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: app de uma coluna (máx. 520px). Início com cabeçalho vinho alto; demais abas com faixa vinho curta. Barra de 6 abas fixa embaixo; detalhes abrem em folhas de tela cheia. */
:root{
  --vinho:#6b1f33; --vinho-2:#87304a; --creme:#f7efe6; --papel:#fffaf4; --branco:#ffffff;
  --rosa:#c97b74; --salvia:#7f9a7e; --dourado:#c49a45;
  --tinta:#2e1a20; --tinta-2:#6f5a5f; --linha:#ead9cc; --chip:#f1e3d6;
  --sobre-vinho:#fbeee6; --ok:#4f7350; --ok-bg:#e3ece0; --and-bg:#f8e7e2; --alerta:#a2463c;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-corpo:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --vinho:#5a1a2b; --vinho-2:#7a2b42; --creme:#1d1416; --papel:#281c1f; --branco:#2f2226;
  --rosa:#d99189; --salvia:#9db59b; --dourado:#d8b062;
  --tinta:#f5e9e1; --tinta-2:#bfa9a6; --linha:#3d2c30; --chip:#352529;
  --sobre-vinho:#fbeee6; --ok:#a9c7a6; --ok-bg:#26332a; --and-bg:#3a2629; --alerta:#e3877c; color-scheme:dark}}
:root[data-theme="dark"]{
  --vinho:#5a1a2b; --vinho-2:#7a2b42; --creme:#1d1416; --papel:#281c1f; --branco:#2f2226;
  --rosa:#d99189; --salvia:#9db59b; --dourado:#d8b062;
  --tinta:#f5e9e1; --tinta-2:#bfa9a6; --linha:#3d2c30; --chip:#352529;
  --sobre-vinho:#fbeee6; --ok:#a9c7a6; --ok-bg:#26332a; --and-bg:#3a2629; --alerta:#e3877c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--creme);color:var(--tinta);font-family:var(--f-corpo);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--vinho)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 56px)}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.28rem}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--tinta-2)}
.small{font-size:.83rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tinta);background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:10px 11px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical}
a{color:var(--vinho-2)}
:root[data-theme="dark"] a{color:var(--rosa)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--rosa)}}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--tinta-2);vertical-align:middle}
.tag.exm{background:color-mix(in srgb,var(--dourado) 22%,transparent);color:var(--tinta)}

/* topo */
.topo{background:var(--vinho);color:var(--sobre-vinho);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px}
.topo.curto{padding-bottom:14px;border-radius:0 0 20px 20px}
.marca{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:1rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo b{font-family:var(--f-corpo);font-weight:700;letter-spacing:.18em;font-size:.74rem;padding:3px 7px;border:1px solid currentColor;border-radius:6px}
.topo-titulo{font-family:var(--f-display);font-size:1.45rem;margin-top:10px}
.topo-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--sobre-vinho);border-radius:999px;padding:5px 12px;font-size:.8rem}
.saud{margin-top:14px;font-family:var(--f-display);font-size:1.55rem;line-height:1.2}
.saud i{color:var(--dourado);font-style:italic}
.data-hoje{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:12px}
.frase-topo{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.frase-topo p{font-family:var(--f-display);font-style:italic;font-size:1.06rem;line-height:1.35}
.frase-topo button{margin-top:8px;border:0;background:none;color:var(--dourado);font-weight:700;font-size:.8rem;padding:4px 0;letter-spacing:.04em}
.topo-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:.84rem}
.hist{display:flex;gap:6px;align-items:center}
.hist span{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
.hist span.f{background:var(--dourado);border-color:var(--dourado)}
.hist span.h{outline:2px solid rgba(255,255,255,.6);outline-offset:1px}
.barra{height:6px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:10px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--dourado);border-radius:9px;transition:width .5s}
.barra.clara{background:var(--chip)}
.barra.clara>i{background:var(--vinho-2)}

.demo{margin-top:12px;background:var(--chip);border-radius:12px;padding:9px 12px;font-size:.82rem;color:var(--tinta-2)}
.sec{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--papel);border:1px solid var(--linha);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;min-height:38px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.destaque{border-color:color-mix(in srgb,var(--dourado) 60%,var(--linha))}
.vazio{border:1.5px dashed var(--linha);border-radius:16px;padding:18px;text-align:center;color:var(--tinta-2);font-size:.9rem}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--vinho);color:var(--sobre-vinho);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.sec2{background:var(--chip);color:var(--tinta)}
.btn.ok{background:var(--salvia);color:#fff}
.btn.ouro{background:var(--dourado);color:#2e1a20}
.btn.escuro{background:var(--tinta);color:var(--creme)}
.btn.mini{padding:7px 12px;font-size:.84rem;border-radius:10px;min-height:38px}
.btn.full{width:100%}
.btn.linkish{background:none;color:var(--tinta-2);text-decoration:underline;padding:4px;min-height:0;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:.78rem;font-weight:600;color:var(--tinta-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-top:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--linha);background:var(--papel);border-radius:999px;padding:8px 14px;font-size:.86rem;font-weight:600;min-height:38px}
.seg button.on{background:var(--tinta);color:var(--creme);border-color:var(--tinta)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--linha);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:36px}
.opt.on{background:var(--rosa);border-color:var(--rosa);color:#fff}
.estado{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--tinta-2);white-space:nowrap}
.estado.and{background:color-mix(in srgb,var(--rosa) 25%,transparent);color:var(--tinta)}
.estado.ok{background:var(--salvia);color:#fff}
.estado.ouro{background:var(--dourado);color:#2e1a20}
.foco{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--dourado) 22%,transparent);color:var(--tinta)}

/* Início */
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resumo>div{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 10px}
.resumo strong{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--vinho-2)}
:root[data-theme="dark"] .resumo strong{color:var(--rosa)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .resumo strong{color:var(--rosa)}}
.resumo span{font-size:.76rem;color:var(--tinta-2)}
.treino-dia{position:relative;background:var(--vinho);color:var(--sobre-vinho);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;overflow:hidden}
.treino-dia::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--dourado) 55%,transparent);pointer-events:none}
.treino-dia .foco{background:rgba(255,255,255,.14);color:var(--sobre-vinho)}
.treino-dia h3{font-family:var(--f-display);font-weight:600;font-size:1.35rem;line-height:1.2}
.treino-dia .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;opacity:.9}
.treino-dia .btn{background:var(--dourado);color:#2e1a20}
.treino-dia .barra{margin-top:0}
.lembrete{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.lembrete .ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--vinho-2)}
.lembrete>div{min-width:0}
.lembrete .x{border:0;background:none;color:var(--tinta-2);font-size:1.2rem;padding:6px}

/* hábitos */
.hab{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.hab>span{font-weight:600;font-size:.88rem}
.copos{display:flex;gap:4px;flex-wrap:wrap}
.copo{width:24px;height:30px;border:1.5px solid var(--salvia);border-radius:3px 3px 7px 7px;background:transparent;padding:0}
.copo.on{background:var(--salvia)}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);background:var(--branco);border-radius:12px;padding:10px 12px;text-align:left;width:100%;min-height:44px}
.chk i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--linha);flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.8rem}
.chk.on i{background:var(--salvia);border-color:var(--salvia)}

/* Treino */
.hero{background:var(--vinho);color:var(--sobre-vinho);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .foco{background:rgba(255,255,255,.14);color:var(--sobre-vinho)}
.hero h2{font-size:1.45rem;color:var(--sobre-vinho)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-stats>div,.hero-stats>button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px;text-align:left;color:inherit}
.hero-stats strong{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:.72rem;opacity:.8}
.hero .barra{margin-top:0;height:8px}
.hero .btn{background:var(--dourado);color:#2e1a20}
.ex{background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .2s}
.ex.andamento{border-color:var(--rosa);background:var(--and-bg)}
.ex.feito{border-color:var(--salvia);background:var(--ok-bg)}
.ex-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ex-abre{display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;min-width:0;width:100%}
.thumb{width:58px;height:58px;border:0;padding:0;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--vinho-2);position:relative}
.thumb small{position:absolute;bottom:3px;right:6px;font-size:.62rem;font-weight:700}
.ex.feito .thumb{background:var(--salvia);color:#fff}
.ex-meta{min-width:0;display:flex;flex-direction:column}
.ex-nome{font-weight:700;line-height:1.25}
.ex-info{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:.82rem;color:var(--tinta-2);align-items:center}
.ex-obs{font-size:.83rem;color:var(--tinta-2);padding-left:70px}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--linha);background:transparent;display:grid;place-items:center;flex:none;color:var(--tinta-2)}
.ex.feito .ck{background:var(--salvia);border-color:var(--salvia);color:#fff}
.ex-baixo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:70px}
.carga{display:inline-flex;align-items:center;gap:2px;background:var(--branco);border:1px solid var(--linha);border-radius:999px;padding:2px}
.carga button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:1.05rem}
.carga span{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.series{display:flex;gap:6px;flex-wrap:wrap}
.serie{min-width:40px;height:38px;border-radius:12px;border:1.5px solid var(--linha);background:var(--branco);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;padding:0 8px}
.serie.on{background:var(--salvia);border-color:var(--salvia);color:#fff}
.conf{display:flex;flex-direction:column;gap:8px;background:var(--and-bg);border-radius:14px;padding:12px}
.descanso-dia{display:flex;flex-direction:column;gap:10px;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:16px}
.concluido{display:flex;gap:12px;align-items:center;background:var(--ok-bg);border:1px solid var(--salvia);border-radius:16px;padding:14px}
.concluido .ic{width:42px;height:42px;border-radius:50%;background:var(--salvia);color:#fff;display:grid;place-items:center;flex:none}
.escolhas{display:flex;flex-direction:column;gap:8px;text-align:left}
.escolhas button{border:1px solid var(--linha);background:var(--creme);border-radius:14px;padding:12px 14px;text-align:left}
.escolhas button.on{border-color:var(--vinho-2);box-shadow:inset 0 0 0 1px var(--vinho-2)}

/* folhas de tela cheia */
.folha-tela{position:fixed;inset:0;z-index:30;background:var(--creme);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:entra .25s ease}
@keyframes entra{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.folha-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.folha-top{position:sticky;top:0;z-index:2;background:var(--creme);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.voltar{border:0;background:var(--chip);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none}
.video-box{background:#160b0e;border-radius:18px;overflow:hidden;display:grid;place-items:center;max-height:52vh;aspect-ratio:3/4;max-width:100%;width:100%}
.video-box.vazio-v{aspect-ratio:16/9}
.video-box video{width:100%;height:100%;max-height:52vh;object-fit:contain;background:#160b0e;display:block}
.video-box .sem{color:#e9d8d2;text-align:center;padding:20px;font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
.serie-ed{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;align-items:center}
.serie-ed .n{font-weight:700;font-size:.85rem;color:var(--tinta-2)}
.serie-ed input{text-align:center;padding:9px 6px}
.serie-ed .serie{width:48px;min-width:0;padding:0}
.serie-hd{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;font-size:.7rem;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.06em}
.dica-box{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:.92rem}
.dica-box ul{margin:4px 0 0;padding-left:18px}
.dica-box.erro{background:color-mix(in srgb,var(--rosa) 14%,var(--papel))}
.alt-box{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px dashed var(--linha);border-radius:14px;padding:10px 12px}
.fim-top{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding-top:6px}
.fim-ic{width:64px;height:64px;border-radius:50%;background:var(--salvia);color:#fff;display:grid;place-items:center}
.fim-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fim-stats>div{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px}
.fim-stats strong{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.fim-stats span{font-size:.78rem;color:var(--tinta-2)}
.fig-palco{border-radius:18px;padding:18px;display:grid;place-items:center;min-height:240px}
.fig-palco.escuro{background:radial-gradient(circle at 30% 20%,#b98a78,transparent 55%),linear-gradient(160deg,#8a5d55,#3d2a2b 70%,#24171a)}
.fig-palco.claro{background:radial-gradient(circle at 70% 25%,#fff8ef,transparent 55%),linear-gradient(160deg,#efe1d3,#d8c1ae 70%,#c6ab96)}
.fig-palco img{display:block;width:100%;max-width:300px;height:auto;max-height:50vh;object-fit:contain}
.fig-palco .carregando{color:#fff;font-size:.9rem}
.premio-banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--dourado) 18%,var(--papel));border:1px solid var(--dourado);border-radius:16px;padding:12px 14px}

/* descanso entre séries */
.descanso{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:35;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.descanso .in{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--tinta);color:var(--creme);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(30,12,18,.25)}
.descanso .t{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em}
.descanso button{border:0;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.14);color:inherit;font-weight:700;font-size:.82rem;min-height:36px}
.descanso.fim .in{background:var(--salvia);color:#fff}

/* Evolução */
.jornada-topo{background:var(--vinho);color:var(--sobre-vinho);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.jornada-topo h2{color:var(--sobre-vinho);font-size:1.4rem}
.jornada-topo .barra{height:8px}
.jornada{list-style:none;margin:0;padding:0;position:relative}
.jornada::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--vinho-2) var(--feito,50%),var(--linha) var(--feito,50%))}
.jornada li{position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:8px 0}
.no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--papel);border:2px solid var(--linha);position:relative;z-index:1;color:var(--tinta-2)}
.no.feito{background:var(--vinho-2);border-color:var(--vinho-2);color:#fff}
.no.vitoria{background:var(--dourado);border-color:var(--dourado);color:#2e1a20}
.no.agora{background:var(--papel);border:3px solid var(--dourado);box-shadow:0 0 0 6px color-mix(in srgb,var(--dourado) 22%,transparent)}
.no.prox{border-style:dashed}
.jornada .txt{padding-top:2px;min-width:0}
.jornada .txt b{display:block}
.jornada li.agora-li .txt{background:var(--papel);border:1px solid var(--dourado);border-radius:16px;padding:12px}
.jornada li.prox-li{opacity:.8}
.graf{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 14px}
.graf-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.badge{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.badge.up{background:var(--ok-bg);color:var(--ok)}
.graf svg{width:100%;height:96px;display:block;margin-top:6px;overflow:visible}
.graf svg text{fill:var(--tinta-2);font-size:10px;font-family:var(--f-corpo)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:12px}
.tile strong{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.78rem;color:var(--tinta-2)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.foto{position:relative;border:0;padding:0;background:none;border-radius:10px;overflow:hidden}
.foto img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.foto.sel{outline:3px solid var(--dourado);outline-offset:-3px}
.foto .n{position:absolute;top:6px;left:6px;background:var(--dourado);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.mapa-row{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;font-size:.9rem}
.mapa-row input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--vinho-2)}
.frase{font-family:var(--f-display);font-style:italic;font-size:1.1rem;line-height:1.35;color:var(--vinho-2)}
:root[data-theme="dark"] .frase{color:var(--rosa)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .frase{color:var(--rosa)}}
.tabela{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.tabela td,.tabela th{padding:7px 5px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
.tabela th{font-size:.74rem;color:var(--tinta-2);font-weight:600}
.scroll-x{overflow-x:auto}
.marco{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:10px 12px}
.data{background:var(--chip);border-radius:12px;text-align:center;padding:6px 0;align-self:start}
.data strong{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.data span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-2)}
.barras{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.barras div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7rem;color:var(--tinta-2);min-width:0}
.barras i{display:block;width:100%;max-width:28px;background:var(--rosa);border-radius:6px 6px 2px 2px;min-height:2px}

/* Prêmios */
.premios-topo{background:var(--papel);border:1px solid var(--dourado);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.premios-topo .grande{font-family:var(--f-display);font-size:2.2rem;line-height:1;color:var(--vinho-2);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .premios-topo .grande{color:var(--rosa)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .premios-topo .grande{color:var(--rosa)}}
.premio{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:14px}
.premio .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--chip);color:var(--tinta-2)}
.premio.liberado{border-color:var(--dourado);background:color-mix(in srgb,var(--dourado) 10%,var(--papel))}
.premio.liberado .ic{background:var(--dourado);color:#2e1a20}
.premio.resgatado .ic{background:var(--salvia);color:#fff}
.premio>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.premio .barra{margin:0;height:6px}

/* VEM */
.evento{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px}
.evento.passado{opacity:.88}
.evento.esp .data{background:color-mix(in srgb,var(--dourado) 25%,transparent)}
.modulo>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modulo>summary::-webkit-details-marker{display:none}
.aula{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--branco);border-radius:14px;padding:10px 12px;text-align:left;width:100%;border:1px solid var(--linha)}
.aula .ic{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--linha);display:grid;place-items:center;font-size:.8rem}
.aula.ok .ic{background:var(--salvia);border-color:var(--salvia);color:#fff}

/* Painel e equipe */
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha)}
.ajuste:last-of-type{border-bottom:0}
.ajuste>div{min-width:0}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--linha);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--branco);transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--salvia)}
.switch[aria-checked="true"]::after{left:23px}
.topo.equipe{background:var(--tinta);color:var(--creme)}
.ed-item{border:1px solid var(--linha);border-radius:14px;background:var(--papel)}
.ed-item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;min-height:48px}
.ed-item>summary::-webkit-details-marker{display:none}
.ed-item>summary::after{content:"›";font-size:1.3rem;color:var(--tinta-2);transition:transform .2s}
.ed-item[open]>summary::after{transform:rotate(90deg)}
.ed-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.ed-list{display:flex;flex-direction:column;gap:8px}
.ed-body .ed-list{border-left:2px solid var(--linha);padding-left:10px}
.dias-sel{display:flex;gap:4px;flex-wrap:wrap}
.dias-sel button{border:1px solid var(--linha);background:transparent;border-radius:8px;padding:6px 8px;font-size:.8rem;min-width:42px;min-height:36px;color:var(--tinta)}
.dias-sel button.on{background:var(--vinho);border-color:var(--vinho);color:var(--sobre-vinho)}

/* navegação inferior: 6 abas */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--papel);border-top:1px solid var(--linha);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.abas .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.abas button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--tinta-2);min-height:50px;min-width:0}
nav.abas button svg{width:22px;height:22px}
nav.abas button.on{color:var(--vinho-2);background:var(--chip)}
:root[data-theme="dark"] nav.abas button.on{color:var(--rosa)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.abas button.on{color:var(--rosa)}}

/* modal */
.veu{position:fixed;inset:0;z-index:40;background:rgba(30,12,18,.55);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.folha{background:var(--papel);border-radius:24px;padding:22px 20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;animation:sobe .35s ease}
.folha.centro{text-align:center}
@keyframes sobe{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.pop{animation:pop .5s ease both}
@media (prefers-reduced-motion:reduce){.folha,.folha-tela,.pop{animation:none}.barra>i,.switch::after{transition:none}}
/* frase do dia */
.frase-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.fseta{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;font-size:1.15rem;line-height:1;display:grid;place-items:center;padding:0}
.fseta.escura{border-color:var(--linha);color:var(--tinta)}
.frase-topo .fbotao{margin-top:8px;border:0;background:none;color:var(--dourado);font-weight:700;font-size:.8rem;padding:4px 0;letter-spacing:.04em}
/* prévia story 9:16 */
.fig-tel{position:relative;width:min(100%,240px);aspect-ratio:9/16;margin:0 auto;border-radius:24px;overflow:hidden;display:grid;place-items:center;box-shadow:0 10px 28px rgba(30,12,18,.25)}
.fig-tel.escuro{background:radial-gradient(circle at 30% 25%,#b98a78,transparent 55%),linear-gradient(170deg,#8a5d55,#3d2a2b 65%,#1f1416)}
.fig-tel.claro{background:radial-gradient(circle at 70% 25%,#fff8ef,transparent 55%),linear-gradient(170deg,#efe1d3,#d8c1ae 65%,#bfa18b)}
.fig-tel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fig-tel .carregando{color:#fff;font-size:.85rem}
/* hábitos: refeições */
.refs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ref{display:flex;gap:8px;align-items:center;border:1px solid var(--linha);background:var(--branco);border-radius:12px;padding:8px 10px;text-align:left;min-height:50px;min-width:0}
.ref i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--linha);flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.8rem}
.ref.on{border-color:var(--salvia)}
.ref.on i{background:var(--salvia);border-color:var(--salvia)}
.ref span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ref b{font-size:.85rem}
.ref small{color:var(--tinta-2);font-size:.75rem}
/* agenda no início */
.evento-dest{background:var(--papel);border:1px solid color-mix(in srgb,var(--dourado) 60%,var(--linha));border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.agenda-linha{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding-top:8px;border-top:1px solid var(--linha)}
.agenda-linha:first-of-type{border-top:0;padding-top:0}
a.lembrete{display:grid}
/* treino */
.treino-item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:10px 12px 10px 10px;text-align:left;width:100%}
.treino-item .thumb{color:var(--vinho-2)}
.carga-in{display:inline-flex;align-items:center;gap:4px;background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:2px 10px 2px 2px}
.carga-in input{width:72px;border:0;background:transparent;text-align:center;font-weight:700;padding:8px 4px;font-variant-numeric:tabular-nums}
.carga-in:focus-within{outline:2px solid var(--dourado);outline-offset:1px}
.carga-in b{font-size:.82rem;color:var(--tinta-2)}
.ck.on{background:var(--salvia);border-color:var(--salvia);color:#fff}
.etapa{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linha)}
.etapa .no-et{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;color:var(--tinta-2)}
.etapa .no-et svg{width:16px;height:16px}
.etapa.ok .no-et{background:var(--salvia);color:#fff}
.etapa.bloq{opacity:.7}
.etapa .ck{width:40px;height:40px}
.etapa.ok .ck{background:var(--salvia);border-color:var(--salvia);color:#fff}
/* alimentação */
.card.refeicao.feita{border-color:var(--salvia)}
.opcoes{display:flex;flex-direction:column;gap:6px}
.opcao{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--linha);background:var(--branco);border-radius:14px;padding:10px 12px;width:100%}
.opcao.on{border-color:var(--salvia);box-shadow:inset 0 0 0 1px var(--salvia);background:var(--ok-bg)}
.op-n{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dourado)}
.op-t{font-size:.9rem}
.op-k{font-size:.76rem;color:var(--tinta-2)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ›";color:var(--tinta-2)}
.lista{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
/* quiz */
.quiz{position:fixed;inset:0;z-index:58;background:var(--creme);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.quiz-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:surge .35s ease both}
.quiz .escolhas button{padding:15px 16px;font-size:.98rem;min-height:56px;background:var(--papel)}
.quiz .escolhas button.on{background:color-mix(in srgb,var(--rosa) 14%,var(--papel))}
/* lembrete em tela */
.lembrete-banner{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:52;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));animation:surge .35s ease both}
.lembrete-banner .in{max-width:500px;margin:0 auto;background:var(--papel);border:1px solid var(--dourado);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 30px rgba(30,12,18,.22)}
.lembrete-banner .ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--dourado) 22%,transparent);display:grid;place-items:center;flex:none;color:var(--vinho-2);font-size:1.2rem}
@media (prefers-reduced-motion:reduce){.quiz-in,.lembrete-banner{animation:none}}


/* ---- revisão visual: menos caixas, menos pílulas, hierarquia pela tipografia ---- */
:root{--r:12px}
body::before{background:var(--creme)}
body.casa::before{background:var(--vinho)}
body.na-equipe::before{background:var(--tinta)}
.topo{border-radius:0;padding-bottom:24px}
.topo.curto{background:var(--creme);color:var(--tinta);border-radius:0;padding-top:16px;padding-bottom:2px}
.topo.curto .logo{color:var(--tinta-2)}
.topo.curto .topo-titulo{font-size:2.1rem;line-height:1.1;margin-top:18px;color:var(--tinta)}
.topo.curto .topo-chip{background:transparent;border-color:var(--linha);color:var(--tinta-2);border-radius:8px}
.topo.curto.equipe{background:var(--tinta);color:var(--creme);padding-bottom:18px}
.topo.curto.equipe .logo,.topo.curto.equipe .topo-titulo{color:var(--creme)}
.topo.curto.equipe .topo-chip{color:var(--creme);border-color:rgba(255,255,255,.3)}
.topo-chip{border-radius:8px}
.data-hoje{text-transform:none;letter-spacing:0;font-size:.88rem;opacity:.75;margin-top:18px}
.saud{font-size:2.05rem;line-height:1.1;margin-top:6px}
.saud i{color:inherit;opacity:.7}
.frase-topo{background:none;border:0;border-left:2px solid var(--dourado);border-radius:0;padding:2px 0 2px 14px;margin-top:20px}
.frase-topo p{font-size:1.18rem;line-height:1.38}
.frase-nav .eyebrow{font-size:.78rem}
.frase-topo .fbotao{letter-spacing:0;font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.topo .logo{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topo-chip{flex-shrink:0}
@media (max-width:420px){.topo.curto .logo{font-size:0}.topo.curto .logo b{font-size:.8rem}}
.fseta{width:30px;height:30px;border-color:rgba(255,255,255,.25)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:600}
.tag,.tag.exm{text-transform:none;letter-spacing:0;font-weight:600;font-size:.72rem;border-radius:4px;padding:1px 6px}
.foco,.treino-dia .foco,.hero .foco{text-transform:none;letter-spacing:0;font-size:.8rem;border-radius:4px;padding:2px 8px}
.estado{border-radius:4px}
.sec{margin-top:30px;gap:14px}
h2{font-size:1.42rem}
.card{border:0;border-radius:var(--r);padding:16px}
.card.destaque{border:0;background:var(--branco)}
.seg{gap:22px;border-bottom:1px solid var(--linha);margin-top:10px;padding-bottom:0}
.seg button{border:0;background:none;border-radius:0;padding:10px 0;min-height:44px;color:var(--tinta-2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{background:none;color:var(--tinta);border-bottom-color:var(--tinta)}
.opt{border-radius:8px}
.opt.on{background:var(--tinta);border-color:var(--tinta);color:var(--creme)}
.btn{border-radius:10px;font-weight:600}
.btn.mini{border-radius:8px}
.pill{border-radius:8px}
.demo{border-radius:8px}
.resumo{gap:0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.resumo>div{background:none;border:0;border-radius:0;padding:14px 4px 12px 0}
.resumo>div+div{border-left:1px solid var(--linha);padding-left:14px}
.resumo strong{font-size:2rem}
.treino-dia,.hero,.jornada-topo,.meta-card{border-radius:var(--r)}
.treino-dia::after{display:none}
.hero-stats>div,.hero-stats>button{border-radius:8px}
.ex,.treino-item,.lembrete,.evento-dest,.graf,.tile,.marco,.descanso-dia,.post,.prem{border:0;border-radius:var(--r)}
.ex.andamento{border:1px solid var(--rosa)}
.ex.feito{border:1px solid var(--salvia)}
.thumb,.lembrete .ic,.premio .ic,.data{border-radius:8px}
.ref,.opcao,.escolhas button,.ed-item,.chk{border-radius:10px}
.premio,.premios-topo{border:0;border-radius:var(--r)}
.premio.liberado{border:0;background:color-mix(in srgb,var(--dourado) 14%,var(--papel))}
.premios-topo{background:var(--papel)}
.vazio{border-radius:var(--r)}
.concluido{border-radius:var(--r)}
.folha{border-radius:18px}
.fig-tel{border-radius:18px}
nav.abas button{border-radius:0;position:relative}
nav.abas button.on{background:none}
nav.abas button.on::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:2px;background:currentColor;border-radius:2px}
.entrada::before,.entrada::after{display:none}
.marca-grande .sigla{border-radius:10px}

/* abertura e login */

      ex("e01","Agachamento livre","Pernas","Pés na largura do quadril. Os joelhos acompanham a ponta dos pés. Desça como se fosse sentar, peito aberto.","Joelhos entrando pra dentro; tirar o calcanhar do chão; curvar as costas","e02"),
      ex("e02","Sentar e levantar do banco","Pernas","Use um banco firme. Sente sem desabar e levante empurrando o chão com os calcanhares.","Desabar no banco; usar impulso do tronco"),
      ex("e03","Leg press 45°","Pernas","Lombar sempre encostada. Não estique os joelhos por completo no fim do movimento.","Tirar a lombar do encosto; travar os joelhos no final","e01"),
      ex("e04","Afundo alternado","Pernas","Passo largo, tronco reto. O joelho de trás desce em direção ao chão.","Joelho da frente passando muito da ponta do pé; tronco caindo pra frente","e05"),
      ex("e05","Afundo estático com apoio","Pernas","Segure na parede ou numa cadeira. Suba e desça sem trocar a posição dos pés.","Ir rápido e perder o equilíbrio; joelho de trás batendo no chão"),
      ex("e06","Elevação de quadril com barra","Glúteos","Queixo levemente pra baixo. Suba contraindo o glúteo e segure 1 segundo no topo.","Arquear a lombar no topo; empurrar com a ponta dos pés","e07"),
      ex("e07","Ponte de glúteo no chão","Glúteos","Pés firmes perto do quadril. Suba devagar e desça controlando.","Subir arqueando a lombar; pés longe demais do quadril"),

      ex("e09","Abdução com elástico deitada","Glúteos","Deitada de lado, quadril empilhado. Suba a perna sem girar o pé pra cima.","Girar o quadril pra trás; subir a perna rápido demais"),
      ex("e10","Remada baixa na polia","Costas","Puxe levando os cotovelos pra trás e aproximando as escápulas.","Encolher os ombros; jogar o tronco pra trás","e11"),
      ex("e11","Remada com elástico","Costas","Elástico preso na altura do peito. Puxe sem encolher os ombros.","Ombros perto das orelhas; soltar o elástico sem controle"),

      ex("e14","Flexão com joelhos apoiados","Peito","Mãos um pouco mais abertas que os ombros. Corpo alinhado do joelho à cabeça.","Quadril caindo; cabeça projetada pra frente"),
      ex("e15","Desenvolvimento com halteres","Ombros","Sentada, costas apoiadas. Suba sem arquear a lombar.","Arquear a lombar; descer o halter rápido demais"),

/* =====================================================================
   1. STORE — mesma interface para o banco do artifact e o modo local
   ===================================================================== */
const Store=(()=>{
  let db=null,live=false;const mem={};const ouvintes=[];const PFX="vem-demo-v3:";
  const lget=p=>{try{const v=localStorage.getItem(PFX+p);if(v!=null)return JSON.parse(v)}catch(e){}return p in mem?clone(mem[p]):null};
  const lset=(p,v)=>{mem[p]=clone(v);try{localStorage.setItem(PFX+p,JSON.stringify(v))}catch(e){}};
  const ldel=p=>{delete mem[p];try{localStorage.removeItem(PFX+p)}catch(e){}};
  function lkeys(col){const out=new Set();const pre=col+"/";Object.keys(mem).forEach(k=>{if(k.startsWith(pre)&&!k.slice(pre.length).includes("/"))out.add(k.slice(pre.length))});
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX+pre)){const r=k.slice((PFX+pre).length);if(!r.includes("/"))out.add(r)}}}catch(e){}return [...out]}
  const lcol=col=>lkeys(col).map(id=>Object.assign({},lget(col+"/"+id),{__id:id}));
  function avisar(p){ouvintes.forEach(o=>{if(o.doc&&o.p===p)o.cb(lget(p));else if(!o.doc&&p.startsWith(o.p+"/")&&!p.slice(o.p.length+1).includes("/"))o.cb(lcol(o.p))})}
  return {
    usarBanco(d){db=d;live=true},
    get aoVivo(){return live},
    async get(p){if(live){const s=await db.doc(p).get();return s.exists?s.data():null}return lget(p)},
    async set(p,v){if(live)return db.doc(p).set(clone(v));lset(p,v);avisar(p)},
    async del(p){if(live)return db.doc(p).delete();ldel(p);avisar(p)},
    async list(col){if(live){const s=await db.collection(col).get();return s.docs.map(d=>Object.assign({},d.data(),{__id:d.id}))}return lcol(col)},
    observarDoc(p,cb){if(live)return db.doc(p).onSnapshot(s=>cb(s.exists?s.data():null),()=>{});ouvintes.push({p,cb,doc:true});cb(lget(p))},
    observarCol(col,cb){if(live)return db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({},d.data(),{__id:d.id}))),()=>{});ouvintes.push({p:col,cb});cb(lcol(col))},
    temLocal(p){return lget(p)!=null}
  };
})();
const filas={},pend={};
function salvar(path,dados,ms){
  clearTimeout(filas[path]);pend[path]=true;
  const go=async(tentativa)=>{
    try{await Store.set(path,dados);delete pend[path]}
    catch(e){const c=e&&e.code;
      if(c==="unavailable"&&!tentativa){setTimeout(()=>go(1),800+Math.random()*700);return}
      delete pend[path];
      if(c==="quota_exceeded")toast("O espaço do app encheu. Avise a equipe VEM.");
      else if(c==="invalid_argument")toast("Seu acesso não permite salvar isso.");
      else toast("Não consegui salvar. Confira sua conexão.");}
  };
  filas[path]=setTimeout(()=>go(0),ms==null?500:ms);
}

function novoCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.textAlign="center";x.textBaseline="alphabetic";return [c,x]}

function recortar(c,h){const [o,x]=novoCanvas(c.width,Math.ceil(h));x.drawImage(c,0,0);return o}

  return recortar(c,y+70);

  y+=70;const cols=[[r.min<1&&r.qtd?"<1":r.min||0,"MINUTOS"],[fmtMil(r.kg||0),"KG DE VOLUME"],["~"+fmtMil(r.kcal||0),"KCAL"]].filter((v,i)=>i!==1||r.kg>0);
  const cw=(W-80)/cols.length;

    x.fillStyle=E.acc;spc(x,"4px");x.font='700 24px "DM Sans", system-ui, sans-serif';x.fillText(l,px,y+142);spc(x,"0px")});

}

    img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      let q=.75,out=c.toDataURL("image/jpeg",q);while(out.length>lim&&q>.35){q-=.1;out=c.toDataURL("image/jpeg",q)}

function carregarFotosNaTela(root){root.querySelectorAll("img[data-fotoid]").forEach(async img=>{const src=await FotoPrato.get(img.dataset.fotoid);if(src)img.src=src;else img.remove()})}

function listaNotificacoes(){
  const out=[];const L=S.perfil.lembretes||{};const H=S.perfil.horarios||{};const N=S.perfil.notif||{};
  const wd={dom:1,seg:2,ter:3,qua:4,qui:5,sex:6,sab:7};
  todosLembretes().forEach(l=>{if(minDe(l.hora)==null)return;out.push({id:"l-"+l.id,titulo:l.titulo,corpo:l.nota||TIPOS_LEMB[l.tipo]||"Lembrete VEM",hora:l.hora,dias:(l.dias||[]).length&&(l.dias||[]).length<7?l.dias.map(x=>wd[x]):[]})});
  if(L.refeicoes!==false)REFEICOES.forEach(([id])=>{if(minDe(H[id])!=null)out.push({id:"r-"+id,titulo:TIT_REF[id],corpo:"Registre o prato no diário da Dieta.",hora:H[id],dias:[]})});
  if(L.agua!==false){const ini=minDe(L.aguaInicio),fim=minDe(L.aguaFim),iv=Math.round((+L.aguaIntervalo||2)*60);
    if(ini!=null&&fim!=null&&iv>0)for(let m=ini+iv,i=0;m<=fim&&i<16;m+=iv,i++)out.push({id:"a-"+i,titulo:"Hora de beber água",corpo:"Um copo agora ajuda a bater a meta de 8 por dia.",hora:String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"),dias:[]})}
  if(N.encontros!==false)proximosEncontros(3).forEach(e=>{if(!e.data||minDe(e.hora)==null)return;const [y,mo,dd]=e.data.split("-").map(Number);const t=new Date(y,mo-1,dd,0,0);t.setMinutes(minDe(e.hora)-30);if(t>new Date())out.push({id:"e-"+e.id,titulo:"Encontro VEM em 30 minutos",corpo:e.tema||"",quando:t.getTime()})});
  return out;
}
let notifT=null;
function agendarNotificacoes(){const n=window.VEMNative&&window.VEMNative.notificacoes;if(!n)return;clearTimeout(notifT);notifT=setTimeout(()=>{try{n.agendar(listaNotificacoes())}catch(e){}},800)}
function lembreteAgora(){
  const k=hojeISO();const d=dia(k);d.feitosL=d.feitosL||{};const am=minAgora();const av=avisadosHoje();
  for(const l of lembretesDoDia(k)){const m=minDe(l.hora);if(m==null||d.feitosL[l.id]||av.includes("l-"+l.id))continue;
    if(am>=m&&am<m+30)return mostrarLembrete("l-"+l.id,l.titulo,l.nota||TIPOS_LEMB[l.tipo]||"",[["Feito",()=>{d.feitosL[l.id]=true;if(l.tipo==="agua")d.agua=Math.min(10,(d.agua||0)+1);salvarDia(k);render();toast("Feito!")}]]),true}
  return false;
}

function editorLista(lista,schema,opts){
  const id=opts.id;const tit=it=>typeof opts.titulo==="function"?opts.titulo(it):(it[opts.titulo]||"(sem título)");
  return `<div class="ed-list">${lista.map((it,i)=>{const oid=id+"."+i;return `<details class="ed-item" ${S.abertos.has(oid)?"open":""} data-oid="${oid}"><summary><span style="min-width:0">${esc(tit(it))} ${it.exemplo?'<span class="tag exm">exemplo</span>':""}</span></summary><div class="ed-body">
    ${campos(it,schema,oid)}
    <div class="row">${i>0?`<button type="button" class="btn mini sec2" data-mv="${oid}" data-d="-1">Subir</button>`:""}${i<lista.length-1?`<button type="button" class="btn mini sec2" data-mv="${oid}" data-d="1">Descer</button>`:""}<span style="flex:1"></span><button type="button" class="btn mini sec2" data-rm="${oid}" style="color:var(--alerta)">Remover</button></div></div></details>`}).join("")}
    <button type="button" class="btn mini sec2" data-add="${id}">+ Adicionar ${esc(opts.n||"item")}</button></div>`;
}
function campos(obj,schema,oid){
  return schema.map(f=>{const fid=(oid+"-"+f.k).replace(/[^\w-]/g,"_");const v=obj[f.k];
    if(f.t==="list")return `<div><div class="eyebrow" style="margin-bottom:6px">${f.l}</div>${editorLista(obj[f.k]=obj[f.k]||[],f.schema,{id:oid+"/"+f.k,titulo:f.titulo,n:f.n})}</div>`;
    if(f.t==="area")return `<label class="lbl" for="${fid}">${f.l}<textarea id="${fid}" rows="3" data-f="${oid}|${f.k}">${esc(v||"")}</textarea></label>`;
    if(f.t==="select")return `<label class="lbl" for="${fid}">${f.l}<select id="${fid}" data-f="${oid}|${f.k}">${f.opts().map(([a,b])=>`<option value="${esc(a)}" ${String(v??"")===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select></label>`;
    if(f.t==="multi")return `<div class="lbl">${f.l}<div class="dias-sel">${f.opts().map(([a,b])=>`<button type="button" class="${(v||[]).includes(a)?"on":""}" data-multi="${oid}|${f.k}|${a}" aria-pressed="${(v||[]).includes(a)}">${esc(b)}</button>`).join("")}</div></div>`;
    if(f.t==="dias")return `<div class="lbl">${f.l}<div class="dias-sel">${DSEM.map(d=>`<button type="button" class="${(v||[]).includes(d)?"on":""}" data-multi="${oid}|${f.k}|${d}" aria-pressed="${(v||[]).includes(d)}">${DSEM_N[d]}</button>`).join("")}</div></div>`;
    if(f.t==="video"||f.t==="pdf"){const podeSubir=!!S.assets||!Store.aoVivo;return `<div class="lbl">${f.l}${v?`<div class="row small" style="color:var(--tinta)"><span class="estado ok">arquivo enviado</span><button type="button" class="btn linkish" data-limpa="${oid}|${f.k}">remover</button></div>${f.t==="video"&&eVideoInterno(v)?`<video src="${esc(v)}" controls playsinline preload="metadata" style="width:100%;max-height:220px;border-radius:12px;background:#160b0e"></video>`:""}`:""}
      ${podeSubir?`<div class="row"><button type="button" class="btn mini sec2" data-up="${oid}|${f.k}|${f.t}">${v?"Trocar arquivo":"Enviar arquivo"}</button><span class="small muted" style="font-weight:400">${f.t==="video"?"MP4 de até 20 MB. Toca dentro do app.":"PDF de até 20 MB."}</span></div>`:`<span class="small muted" style="font-weight:400">Envio de arquivos indisponível nesta conta. Use o link externo.</span>`}</div>`}
    const tp={date:"date",time:"time",number:"number"}[f.t]||"text";
    return `<label class="lbl" for="${fid}">${f.l}<input id="${fid}" type="${tp}" ${tp==="number"?'inputmode="decimal" step="any"':""} value="${esc(v??"")}" placeholder="${esc(f.ph||"")}" data-f="${oid}|${f.k}"></label>`}).join("");
}
function resolver(oid){const [raiz,...resto]=oid.split("/");const [nomeL,i0]=raiz.split(".");let obj=S.editorRaizes[nomeL].lista[+i0];const cadeia=[obj];resto.forEach(p=>{const [k,i]=p.split(".");obj=obj[k][+i];cadeia.push(obj)});return {obj,cadeia}}
function resolverLista(id){const partes=id.split("/");if(partes.length===1)return {lista:S.editorRaizes[id].lista,dono:null};const ultimo=partes.pop();const pai=resolver(partes.join("/"));return {lista:pai.obj[ultimo],dono:pai.cadeia}}
function novoDaLista(id){const [raiz,...resto]=id.split("/");if(!resto.length)return S.editorRaizes[raiz].novo();let sch=S.editorRaizes[raiz.split(".")[0]].schema;let f=null;resto.forEach(p=>{f=sch.find(x=>x.k===p.split(".")[0]);sch=f.schema});return f.novo()}
function ligarEditor(box){
  const sujar=cadeia=>(cadeia||[]).forEach(o=>{if(o&&o.exemplo)delete o.exemplo});
  box.querySelectorAll("[data-f]").forEach(el=>{const ev=el.tagName==="SELECT"?"change":"input";el.addEventListener(ev,()=>{const [oid,k]=el.dataset.f.split("|");const r=resolver(oid);
    let v=el.value;if(el.type==="number")v=v===""?null:num(v);r.obj[k]=v;sujar(r.cadeia);
    const sum=el.closest("details").querySelector(":scope>summary>span");if(sum&&["nome","titulo","exId"].includes(k)){const tg=sum.querySelector(".tag");if(tg)tg.remove();sum.textContent=k==="exId"?exNome(v):(v||"(sem título)")}})});
  box.querySelectorAll("[data-multi]").forEach(b=>b.onclick=()=>{const [oid,k,v]=b.dataset.multi.split("|");const r=resolver(oid);const a=r.obj[k]=r.obj[k]||[];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);sujar(r.cadeia);b.classList.toggle("on");b.setAttribute("aria-pressed",String(i<0))});
  box.querySelectorAll("details[data-oid]").forEach(d=>d.addEventListener("toggle",()=>{d.open?S.abertos.add(d.dataset.oid):S.abertos.delete(d.dataset.oid)}));
  box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const L=resolverLista(b.dataset.add);L.lista.push(novoDaLista(b.dataset.add));S.abertos.add(b.dataset.add+"."+(L.lista.length-1));sujar(L.dono);render()});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{b.textContent="Confirmar remoção";b.onclick=()=>{const oid=b.dataset.rm;const c=oid.lastIndexOf(".");const L=resolverLista(oid.slice(0,c));L.lista.splice(+oid.slice(c+1),1);sujar(L.dono);S.abertos.clear();render()}});
  box.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const oid=b.dataset.mv;const c=oid.lastIndexOf(".");const L=resolverLista(oid.slice(0,c));const i=+oid.slice(c+1);const j=i+(+b.dataset.d);[L.lista[i],L.lista[j]]=[L.lista[j],L.lista[i]];S.abertos.delete(oid);S.abertos.add(oid.slice(0,c)+"."+j);render()});
  box.querySelectorAll("[data-limpa]").forEach(b=>b.onclick=()=>{const [oid,k]=b.dataset.limpa.split("|");resolver(oid).obj[k]="";render()});
  box.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const [oid,k,tipo]=b.dataset.up.split("|");const inp=document.createElement("input");inp.type="file";inp.accept=tipo==="video"?"video/mp4,video/webm,video/quicktime":"application/pdf";
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>20*1024*1024){toast("Arquivo maior que 20 MB. Comprima antes de enviar.");return}
      b.disabled=true;b.textContent="Enviando…";
      try{let url;if(S.assets){const up=await S.assets.upload(f,{type:f.type||undefined});url=up.url}else url=URL.createObjectURL(f);
        const r=resolver(oid);r.obj[k]=url;if(tipo==="pdf"&&"pdfNome" in r.obj&&!r.obj.pdfNome)r.obj.pdfNome=f.name.replace(/\.pdf$/i,"");sujar(r.cadeia);toast(S.assets?"Arquivo enviado. Publique pra salvar.":"Na demonstração o arquivo só vale nesta sessão.");render()}
      catch(e){toast(e&&e.code==="too_large"?"Arquivo grande demais.":e&&e.code==="unsupported_type"?"Formato não aceito. Use MP4 ou PDF.":"Não consegui enviar o arquivo.");render()}};inp.click()});
}

async function carregarPessoal(){
  const [perfil,dias,med,mapa,marcos,quiz]=await Promise.all([Store.get(base()+"/perfil"),Store.list(base()+"/x/dias"),Store.list(base()+"/x/medidas"),Store.list(base()+"/x/mapa"),Store.list(base()+"/x/marcos"),Store.get(base()+"/quiz")]);
  const pd=clone(PERFIL_PADRAO);S.perfil=Object.assign(pd,perfil||{});
  ["notif","privacidade","lembretes"].forEach(k=>S.perfil[k]=Object.assign({},PERFIL_PADRAO[k],(perfil||{})[k]||{}));
  S.perfil.horarios=Object.assign({},HORARIOS_PADRAO,(perfil||{}).horarios||{});
  S.perfil.premios=Object.assign(clone(PERFIL_PADRAO.premios),(perfil||{}).premios||{});S.perfil.premios.resgatados=S.perfil.premios.resgatados||{};S.perfil.premios.avisados=S.perfil.premios.avisados||[];
  ["encontros","corrida"].forEach(k=>S.perfil[k]=S.perfil[k]||{});["avisosLidos","habitosCustom","meusLembretes","lembretesOff"].forEach(k=>S.perfil[k]=S.perfil[k]||[]);if(!S.perfil.modalidade)S.perfil.modalidade="academia";
  S.dias={};dias.forEach(d=>{const id=d.__id;delete d.__id;S.dias[id]=d});
  S.medidas=med.map(m=>{delete m.__id;return m});S.mapa={};mapa.forEach(m=>{const id=m.__id;delete m.__id;S.mapa[id]=m});S.marcos=marcos.map(m=>{delete m.__id;return m});
  S.quiz=quiz||null;
  agendarNotificacoes();
}
const ultimoSnap={};
function mudou(chave,v){const j=JSON.stringify(v);if(ultimoSnap[chave]===j)return false;ultimoSnap[chave]=j;return true}
function observarConteudo(){
  ["treinos","agenda","geral","cardapios"].forEach(doc=>Store.observarDoc("conteudo/"+doc,v=>{if(!mudou("c:"+doc,v))return;if(v)S.conteudo[doc]=Object.assign(clone(S.conteudo[doc]),v);agendarNotificacoes();agendarRender()}));
  if(S.equipe){
    Store.observarCol("checkins",l=>{if(!mudou("checkins",l))return;S.checkins={};l.forEach(d=>{const id=d.__id;delete d.__id;S.checkins[id]=d});if(S.aba==="equipe")agendarRender()});
    Store.observarCol("quiz",l=>{if(!mudou("quiz",l))return;S.quizzes={};l.forEach(d=>{const id=d.__id;delete d.__id;S.quizzes[id]=d});if(S.aba==="equipe")agendarRender()});
  }
}

      tr.itens.forEach(x=>{s.exMap[x.id]=x.exId;s.series[x.id]=Array.from({length:x.series},()=>({reps:parseInt(x.reps)||null,carga:x.carga?(x.carga+(i<8?(x.carga>=10?2:1):0)):0,feito:true}))});reg.sessoes.push(s)}

  Store.set(base()+"/x/medidas/2",{id:"2",data:isoDe(addDias(new Date(),-3)),peso:73.5,cintura:82.5,quadril:103,braco:30});

async function iniciar(){
  let db=null,user=null;
  if(window.claude&&window.claude.use){try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}}
  let id=null;if(db&&user){try{id=await user.id()}catch(e){}}
  if(db&&user&&id){
    Store.usarBanco(db);S.uid=id;S.user=user;
    try{const me=await user.me();S.nome=(me&&me.name)||""}catch(e){}
    try{S.equipe=!!(await user.canEdit())}catch(e){}
    window.claude.use("assets").then(a=>{S.assets=a}).catch(()=>{});
    window.claude.use("downloads").then(d=>{S.downloads=d}).catch(()=>{});
  }else{S.uid="demo";S.nome="Participante";S.equipe=true;semearDemo()}
  try{await carregarPessoal()}catch(e){toast("Não consegui carregar seus dados. Recarregue a página.")}
  observarConteudo();
  if(sessoesConcluidas().length)publicarParticipacao();
  S.pronto=true;render();
  aposEntrar();
}
function aposEntrar(){
  if(!S.pronto||!$("#entrada").hidden)return;
  if(!S.quiz)return abrirQuiz(false);
  if(!S.perfil.nivel)return abrirEscolhaNivel(true);
  const nv=novosPremios();if(Store.aoVivo)modalPremios(nv);
  setTimeout(checarLembretes,2500);
}

  el.innerHTML=MARCA+`<form class="login-card" id="fLogin" novalidate>
      <div><h2>Que bom te ver aqui</h2><p class="small muted" style="margin-top:4px">Entre com o e-mail da sua assinatura VEM.</p></div>
      ${msg?`<p class="small" style="color:var(--ok)">${esc(msg)}</p>`:""}
      <label class="lbl" for="lgEmail">E-mail<input id="lgEmail" type="email" inputmode="email" autocomplete="username" placeholder="voce@email.com" value="${esc((lerSessao()||{}).email||S.ultimoEmail||"")}"></label>
      <label class="lbl" for="lgSenha">Senha<span class="campo-senha"><input id="lgSenha" type="password" autocomplete="current-password" placeholder="Sua senha"><button type="button" id="verSenha" aria-label="Mostrar senha">mostrar</button></span></label>
      <span class="erro-campo" id="lgErro" role="alert"></span>
      <button class="btn full" type="submit" id="lgEntrar">Entrar</button>
      <button class="btn linkish" type="button" id="lgEsqueci">Esqueci minha senha</button>
      ${!Store.aoVivo?`<p class="small muted" style="text-align:center">Protótipo: qualquer e-mail válido e senha com 6 caracteres entram. A senha não é guardada.</p>`:`<p class="small muted" style="text-align:center">Protótipo: a senha não é guardada. Seus dados ficam ligados à sua conta.</p>`}
    </form>
    <p class="login-rodape">Ainda não faz parte? <a href="https://vemclube.com.br" target="_blank" rel="noopener">Quero entrar na VEM</a></p>`;
  const em=$("#lgEmail"),se=$("#lgSenha"),er=$("#lgErro");
  setTimeout(()=>{(em.value?se:em).focus({preventScroll:true})},350);
  $("#verSenha").onclick=()=>{const v=se.type==="password";se.type=v?"text":"password";$("#verSenha").textContent=v?"ocultar":"mostrar";$("#verSenha").setAttribute("aria-label",v?"Ocultar senha":"Mostrar senha")};
  $("#lgEsqueci").onclick=()=>{const e=em.value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){er.textContent="Digite seu e-mail acima pra receber o link.";em.focus();return}
    er.textContent="";S.ultimoEmail=e;telaLogin("Se esse e-mail tiver uma assinatura, você vai receber um link pra criar uma nova senha. (No protótipo, nenhum e-mail é enviado.)")};
  $("#fLogin").onsubmit=e=>{e.preventDefault();const email=em.value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent="Confira o e-mail: parece que falta algo.";em.focus();return}
    if(se.value.length<6){er.textContent="A senha precisa ter pelo menos 6 caracteres.";se.focus();return}
    er.textContent="";const b=$("#lgEntrar");b.disabled=true;b.textContent="Entrando…";se.value="";
    setTimeout(()=>{gravarSessao({email,desde:Date.now()});fecharEntrada()},450)};
}
function fecharEntrada(){
  const el=$("#entrada");el.classList.add("sai");document.body.style.overflow="";
  setTimeout(()=>{el.hidden=true;el.innerHTML="";el.className="entrada";aposEntrar()},460);
}
function sair(){gravarSessao(null);S.aba="inicio";S.folha=null;S.descanso=null;try{history.replaceState(null,"","#inicio")}catch(e){}render();telaLogin("Você saiu da sua conta.")}

/* =====================================================================
   QUIZ INICIAL (uma vez; refazer pelo Painel)
   Respostas completas: data/users/<id>/quiz (privado).
   Resumo para a equipe: quiz/<id> (sem peso, altura, idade nem saúde).
   Regra do cardápio: gasto estimado por Mifflin-St Jeor × nível de atividade;
   meta = gasto − 500 kcal se o objetivo é emagrecer. Meta ≥ 1.600 → 1800; senão 1400.
   ===================================================================== */
const QUIZ=[
  {k:"objetivo",t:"Qual é o seu principal objetivo agora?",ops:[["emagrecer","Emagrecer com saúde"],["forca","Ganhar força e condicionamento"],["rotina","Manter o peso e criar rotina"]]},
  {k:"corpo",t:"Pra calcular seu cardápio",sub:"Esses números ficam só com você. A equipe não vê.",tipo:"numeros"},
  {k:"atividade",t:"Como é sua rotina hoje, sem contar os treinos da VEM?",ops:[["sedentaria","Passo a maior parte do dia sentada"],["leve","Ando um pouco, mas me exercito pouco"],["moderada","Me exercito 3 a 4 vezes por semana"],["alta","Me exercito 5 vezes ou mais por semana"]]},
  {k:"experiencia",t:"Qual sua experiência com musculação?",ops:[["iniciante","Nunca treinei ou estou voltando agora"],["intermediaria","Treino há menos de um ano e conheço os exercícios"],["avancada","Treino há mais de um ano com constância"]]},
  {k:"local",t:"Onde você vai treinar?",ops:[["academia","Na academia"],["casa","Em casa"]]},
  {k:"dias",t:"Quantos dias por semana você consegue treinar?",ops:[["2","2 dias"],["3","3 dias"],["4","4 dias"],["5","5 dias ou mais"]]},
  {k:"alimentacao",t:"Como é a sua alimentação?",ops:[["tradicional","Como de tudo"],["vegetariano","Sou vegetariana (como ovos e laticínios)"],["sem-gluten","Não como glúten"],["sem-lactose","Não consumo lactose"]]},
  {k:"saude",t:"Alguma dessas situações vale pra você?",ops:[["nenhuma","Nenhuma delas"],["gestante","Estou grávida ou amamentando"],["condicao","Tenho uma condição de saúde em acompanhamento"],["lesao","Tenho lesão ou dor que limita algum movimento"]]}
];
const OBJ_TXT={emagrecer:"Emagrecer com saúde",forca:"Ganhar força e condicionamento",rotina:"Manter o peso e criar rotina"};
const Q={i:0,r:{},refazer:false};
function recomendar(r){
  const fat={sedentaria:1.2,leve:1.375,moderada:1.55,alta:1.725}[r.atividade]||1.375;
  const tmb=10*(+r.peso)+6.25*(+r.altura)-5*(+r.idade)-161;const gasto=Math.round(tmb*fat);const meta=r.objetivo==="emagrecer"?gasto-500:gasto;
  const kcal=meta>=1600?1800:1400;const semCard=CONTRAINDICACOES.includes(r.saude);
  return {cardapio:semCard?null:kcal+"-"+r.alimentacao,kcal:semCard?null:kcal,gasto,meta,nivel:r.experiencia,local:r.local,dias:+r.dias,semCardapio:semCard,alerta:r.saude!=="nenhuma"?r.saude:null};
}
function abrirQuiz(refazer){Q.i=0;Q.refazer=!!refazer;Q.r=refazer&&S.quiz?clone(S.quiz.respostas||{}):{};desenharQuiz()}
function fecharQuiz(){const el=$("#quiz");el.hidden=true;el.innerHTML="";document.body.style.overflow=""}
function desenharQuiz(){
  const el=$("#quiz");el.hidden=false;document.body.style.overflow="hidden";el.scrollTop=0;
  if(Q.i>=QUIZ.length)return resultadoQuiz();
  const s=QUIZ[Q.i];const r=Q.r;
  const corpo=s.tipo==="numeros"?`<form class="card" id="qNum" novalidate>
      <div class="grid2"><label class="lbl" for="qIdade">Idade<input id="qIdade" type="number" inputmode="numeric" min="16" max="90" value="${esc(r.idade||"")}" placeholder="anos"></label>
      <label class="lbl" for="qAltura">Altura (cm)<input id="qAltura" type="number" inputmode="numeric" min="130" max="210" value="${esc(r.altura||"")}" placeholder="ex: 165"></label></div>
      <label class="lbl" for="qPeso">Peso atual (kg)<input id="qPeso" type="number" inputmode="decimal" step="0.1" min="35" max="250" value="${esc(r.peso||"")}" placeholder="ex: 72,5"></label>
      <span class="erro-campo" id="qErro" role="alert"></span><button class="btn full" type="submit">Continuar</button></form>`
    :`<div class="escolhas">${s.ops.map(([v,l])=>`<button class="${r[s.k]===v?"on":""}" data-q="${v}" aria-pressed="${r[s.k]===v}">${esc(l)}</button>`).join("")}</div>`;
  el.innerHTML=`<div class="quiz-in">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">${Q.i>0?`<button class="voltar" id="qVolta" aria-label="Pergunta anterior">${ICON.voltar}</button>`:`<span class="logo" style="color:var(--vinho-2)"><b>VEM</b></span>`}<span class="small muted num">${Q.i+1} de ${QUIZ.length}</span>${Q.refazer?`<button class="btn linkish small" id="qFecha">fechar</button>`:`<span style="width:42px"></span>`}</div>
    <div class="barra clara" style="margin:0"><i style="width:${Math.round(Q.i/QUIZ.length*100)}%"></i></div>
    ${Q.i===0?`<div class="eyebrow">Antes de começar</div><p class="small muted" style="margin-top:-8px">Responda uma vez pra gente indicar seu treino e seu cardápio. Leva um minuto.</p>`:""}
    <h2 style="font-size:1.5rem">${esc(s.t)}</h2>${s.sub?`<p class="small muted" style="margin-top:-8px">${esc(s.sub)}</p>`:""}
    ${corpo}</div>`;
  const vt=$("#qVolta");if(vt)vt.onclick=()=>{Q.i--;desenharQuiz()};
  const fc=$("#qFecha");if(fc)fc.onclick=fecharQuiz;
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{r[s.k]=b.dataset.q;el.querySelectorAll("[data-q]").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>{Q.i++;desenharQuiz()},180)});
  const fn=$("#qNum");if(fn){setTimeout(()=>{const i=$("#qIdade");if(i&&!i.value)i.focus({preventScroll:true})},200);
    fn.onsubmit=e=>{e.preventDefault();const id=num($("#qIdade").value),al=num($("#qAltura").value),pe=num($("#qPeso").value);const er=$("#qErro");
      if(id==null||id<16||id>90){er.textContent="Digite sua idade (entre 16 e 90 anos).";return}
      if(al==null||al<130||al>210){er.textContent="Digite sua altura em centímetros, por exemplo 165.";return}
      if(pe==null||pe<35||pe>250){er.textContent="Digite seu peso em kg, por exemplo 72,5.";return}
      Object.assign(r,{idade:id,altura:al,peso:pe});document.activeElement&&document.activeElement.blur();Q.i++;desenharQuiz()}}
}
function programaPara(nivel,local){const ps=S.conteudo.treinos.programas||[];return ps.find(p=>p.modalidade===local&&(p.niveis||[]).includes(nivel))||ps.find(p=>p.modalidade===local)||null}
function resultadoQuiz(){
  const res=recomendar(Q.r);const p=programaPara(res.nivel,res.local);const el=$("#quiz");
  const ALERTAS={gestante:"Na gestação e na amamentação, a alimentação precisa ser montada por uma nutricionista. Por isso os cardápios ficam fechados pra você. Antes de treinar, peça liberação médica.",
    condicao:"Como você tem uma condição de saúde em acompanhamento, os cardápios ficam fechados pra você: a alimentação precisa ser orientada pelo profissional que te acompanha. Mostre o treino a ele antes de seguir.",
    lesao:"Respeite seus limites: se algum exercício causar dor, use a alternativa indicada ou pule. Se puder, converse com uma fisioterapeuta."};
  el.innerHTML=`<div class="quiz-in">
    <div class="fim-top"><div class="fim-ic pop">${ICON.check}</div><h2 style="font-size:1.5rem">Seu plano está pronto</h2><p class="small muted">${esc(OBJ_TXT[Q.r.objetivo]||"")}</p></div>
    <div class="card destaque"><div class="eyebrow">Treino indicado</div><h3 style="font-family:var(--f-display);font-size:1.2rem">${esc(p?p.nome:MODALIDADES[res.local]+" · "+NIVEIS[res.nivel])}</h3><p class="small">${res.dias} treinos por semana · ${esc(NIVEIS[res.nivel])} · ${esc(MODALIDADES[res.local])}</p></div>
    <div class="card destaque"><div class="eyebrow">Cardápio indicado</div>${res.cardapio?`<h3 style="font-family:var(--f-display);font-size:1.2rem">${esc(cardLabel(res.cardapio)||res.cardapio)}</h3><p class="small muted">Calculado a partir da sua idade, altura, peso, rotina e objetivo.</p>`:`<p class="small">Indisponível pela sua resposta de saúde.</p>`}</div>
    ${res.alerta?`<div class="card" style="border-color:var(--rosa)"><p class="small">${esc(ALERTAS[res.alerta])}</p></div>`:""}
    <p class="small muted">Você pode trocar o treino e o cardápio quando quiser, e refazer o quiz no Painel.</p>
    <button class="btn full" id="qOk">Começar</button><button class="btn linkish" id="qRev">Revisar respostas</button></div>`;
  $("#qRev").onclick=()=>{Q.i=0;desenharQuiz()};
  $("#qOk").onclick=()=>salvarQuiz(res);
}
function salvarQuiz(res){
  const doc={respostas:clone(Q.r),resultado:res,feitoEm:hojeISO()};S.quiz=doc;
  Object.assign(S.perfil,{nivel:res.nivel,modalidade:res.local,metaSemanal:res.dias,cardapio:res.cardapio});
  if(!S.perfil.objetivo)S.perfil.objetivo=OBJ_TXT[Q.r.objetivo]||"";
  S.cardSel=null;S.filtro={local:null,nivel:null,foco:"todos"};
  salvar(base()+"/quiz",doc,0);salvarPerfil();
  if(S.perfil.privacidade.contarEquipe!==false)salvar("quiz/"+S.uid,{objetivo:Q.r.objetivo,nivel:res.nivel,local:res.local,dias:res.dias,alimentacao:Q.r.alimentacao,cardapio:res.cardapio||"",feitoEm:doc.feitoEm},0);
  publicarParticipacao();fecharQuiz();S.aba="inicio";render();window.scrollTo(0,0);toast("Plano salvo. Bora!");
}

render();abertura();iniciar();
})();
</script>
